name: Verify AQ-2026-10-4 H_AQ-001
on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install numpy pytest
      - name: Test n<=4 - 7440 joins
        run: PYTHONPATH=AQARION-QUANTARION-AI/source/AQ-2026-10-4 python -m pytest AQARION-QUANTARION-AI/source/AQ-2026-10-4/tests/test_join_stability_property.py -v
