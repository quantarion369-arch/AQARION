name: AQARION D22 Direct Projection Validation

on:
  push:
    branches:
      - main
    paths:
      - "AQARION-QUANTARION-AI/verification/D22/**"
      - ".github/workflows/D22-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "AQARION-QUANTARION-AI/verification/D22/**"
      - ".github/workflows/D22-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d22-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: D22 Direct Projection Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check logging pipeline failure propagation
        shell: bash
        run: |
          set -euo pipefail

          control_dir="$(mktemp -d)"
          trap 'rm -rf "$control_dir"' EXIT

          bash --noprofile --norc -e -o pipefail -c \
            'python -c "import sys; sys.exit(0)" 2>&1 | tee "$1"' \
            bash "$control_dir/pass.txt"
          echo "PIPELINE_PASS_CONTROL_OK"

          if bash --noprofile --norc -e -o pipefail -c \
            'python -c "import sys; sys.exit(7)" 2>&1 | tee "$1"' \
            bash "$control_dir/fail.txt"; then
            echo "PIPELINE_CONTROL_FAILED: validator failure was masked"
            exit 1
          else
            status=$?
            if [ "$status" -ne 7 ]; then
              echo "PIPELINE_CONTROL_FAILED: expected 7, got $status"
              exit 1
            fi
            echo "PIPELINE_FAILURE_CONTROL_OK: exit 7 preserved"
          fi

      - name: Compile D22 audit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            AQARION-QUANTARION-AI/verification/D22/D22_DIRECT_PROJECTION_AUDIT.py

      - name: Run D22 direct projection audit
        shell: bash
        run: |
          set -euo pipefail
          python AQARION-QUANTARION-AI/verification/D22/D22_DIRECT_PROJECTION_AUDIT.py \
            2>&1 | tee AQARION-QUANTARION-AI/verification/D22/D22-direct-projection-report.txt

      - name: Upload D22 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d22-validation-${{ github.sha }}
          path: |
            AQARION-QUANTARION-AI/verification/D22/D22-direct-projection-report.txt
          if-no-files-found: error
          retention-days: 30
