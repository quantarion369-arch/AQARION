name: Mobile Research Kit Regression

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Recorded regression on Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Locate package
        id: package
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          matches = set()

          for runner in workspace.rglob("tools/run_regression.py"):
              root = runner.parent.parent
              required = [
                  root / "manifest.json",
                  root / "tools" / "verify_package.py",
                  root / "tools" / "run_workflow.py",
              ]
              if all(path.is_file() for path in required):
                  if (root / "tests").is_dir():
                      matches.add(root.resolve())

          if len(matches) != 1:
              print("PACKAGE_LOCATION_ERROR: Expected exactly one package.")
              print("MATCHES:", len(matches))
              for root in sorted(matches):
                  print(root)
              raise SystemExit(2)

          root = matches.pop()
          relative = root.relative_to(workspace).as_posix()
          if any(char in relative for char in (chr(10), chr(13))):
              raise SystemExit("PACKAGE_LOCATION_ERROR: Invalid path.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("root=" + relative + chr(10))

          print("PACKAGE_ROOT:", relative)
          PY

      - name: Run recorded regression workflow
        working-directory: ${{ steps.package.outputs.root }}
        shell: bash
        run: |
          python tools/run_workflow.py \
            --timeout 180 \
            --output-root reports/github-regression \
            -- python tools/run_regression.py

      - name: Preserve recorded evidence
        if: ${{ always() && steps.package.outputs.root != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: mobile-research-kit-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.root }}/reports/github-regression/
          if-no-files-found: warn
          retention-days: 14
