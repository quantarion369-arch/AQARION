name: Arithmetic research verification

on:
  push:
    branches: [main]
    paths:
      - 'AQARION-QUANTARION-AI/research/frequency-arithmetic-experiments/**'
      - '.github/workflows/frequency-arithmetic-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AQARION-QUANTARION-AI/research/frequency-arithmetic-experiments/**'
      - '.github/workflows/frequency-arithmetic-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arithmetic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arithmetic:
    name: Arithmetic / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}

      - name: Verify evidence and replay arithmetic experiments
        run: >
          python -I -B
          AQARION-QUANTARION-AI/research/frequency-arithmetic-experiments/ci/verify_arithmetic.py
