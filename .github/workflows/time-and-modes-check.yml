name: Time and Modes Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: AQARION-QUANTARION-AI/research/time-and-modes/requirements.txt

      - name: Install declared dependencies
        working-directory: AQARION-QUANTARION-AI/research/time-and-modes
        shell: bash
        run: |
          set -eu
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c 'import numpy, scipy; print("NumPy", numpy.__version__); print("SciPy", scipy.__version__)'

      - name: Verify required files
        working-directory: AQARION-QUANTARION-AI/research/time-and-modes
        shell: bash
        run: |
          set -eu
          for file in run.sh requirements.txt causal_estimator.py test_causal_estimator.py timing_models.py
          do
            test -f "$file" || { echo "MISSING: $file"; exit 1; }
            echo "FOUND: $file"
          done

      - name: Run your script
        working-directory: AQARION-QUANTARION-AI/research/time-and-modes
        shell: bash
        run: |
          set -eu
          LOG_DIR="$RUNNER_TEMP/time-and-modes-check"
          mkdir -p "$LOG_DIR"

          cp run.sh "$LOG_DIR/run-script.txt"
          sha256sum run.sh causal_estimator.py test_causal_estimator.py timing_models.py > "$LOG_DIR/source-sha256.txt"

          set +e
          bash -ex -o pipefail run.sh 2>&1 | tee "$LOG_DIR/run.log"
          result=${PIPESTATUS[0]}
          set -e

          echo "$result" > "$LOG_DIR/exit-code.txt"
          echo "Script exit code = $result" >> "$GITHUB_STEP_SUMMARY"

          exit "$result"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-and-modes-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/time-and-modes-check/
          if-no-files-found: warn
          retention-days: 30
