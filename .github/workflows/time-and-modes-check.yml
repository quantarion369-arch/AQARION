name: Time and Modes Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/time-and-modes-check"
          git rev-parse HEAD > "$RUNNER_TEMP/time-and-modes-check/commit.txt"
          python --version > "$RUNNER_TEMP/time-and-modes-check/python-version.txt" 2>&1

      - name: Run your script
        working-directory: AQARION-QUANTARION-AI/research/time-and-modes
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="$RUNNER_TEMP/time-and-modes-check"

          test -f run.sh
          test -f causal_estimator.py
          test -f test_causal_estimator.py
          test -f timing_models.py

          cp run.sh "$LOG_DIR/run-script.txt"
          sha256sum run.sh causal_estimator.py test_causal_estimator.py timing_models.py > "$LOG_DIR/source-sha256-before.txt"
          python -m pip freeze > "$LOG_DIR/environment.txt"

          set +e
          bash -e -o pipefail run.sh 2>&1 | tee "$LOG_DIR/run.log"
          result=${PIPESTATUS[0]}
          set -e

          echo "$result" > "$LOG_DIR/exit-code.txt"
          sha256sum run.sh causal_estimator.py test_causal_estimator.py timing_models.py > "$LOG_DIR/source-sha256-after.txt"

          echo "Script exit code = $result" >> "$GITHUB_STEP_SUMMARY"
          echo "This checks execution, not all scientific claims." >> "$GITHUB_STEP_SUMMARY"

          exit "$result"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-and-modes-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/time-and-modes-check/
          if-no-files-found: warn
          retention-days: 30
