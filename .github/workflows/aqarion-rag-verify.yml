name: AQARION RAG Verification

'on':
  push:
    branches: [main]
    paths:
      - "AQARION-QUANTARION-AI/PACKAGES/AQARION-RAG/**"
      - ".github/workflows/aqarion-rag-verify.yml"
  pull_request:
    paths:
      - "AQARION-QUANTARION-AI/PACKAGES/AQARION-RAG/**"
      - ".github/workflows/aqarion-rag-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      EVIDENCE_DIR: ${{ runner.temp }}/aqarion-rag-evidence

    steps:
      - name: Check out tested revision with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p "$EVIDENCE_DIR"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.13"

      - name: Install test dependency
        run: python -m pip install pytest==9.1.1

      - name: Verify pinned sources and run tests
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import platform
          import subprocess
          import sys
          import traceback
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          out = Path(os.environ["EVIDENCE_DIR"]).resolve()
          out.mkdir(parents=True, exist_ok=True)
          package_relative = "AQARION-QUANTARION-AI/PACKAGES/AQARION-RAG"
          package = root / package_relative
          workflow = ".github/workflows/aqarion-rag-verify.yml"

          report = {
              "status": "FAIL",
              "execution_context": (
                  "github_actions"
                  if os.environ.get("GITHUB_ACTIONS") == "true"
                  else "local_rehearsal"
              ),
              "expected_commit": os.environ["GITHUB_SHA"],
              "python": sys.version,
              "platform": platform.platform(),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "pytest_exit": None,
          }

          def git(*args):
              return subprocess.check_output(
                  ["git", "-C", str(root), *args]
              )

          def fingerprint(paths):
              return {
                  relative: hashlib.sha256(
                      (root / relative).read_bytes()
                  ).hexdigest()
                  for relative in paths
              }

          try:
              head = git("rev-parse", "HEAD").decode().strip()
              report["tested_commit"] = head
              if head != report["expected_commit"]:
                  raise RuntimeError("Checked-out HEAD differs from expected commit")

              report["pytest_version"] = importlib.metadata.version("pytest")
              report["git_status_before"] = git(
                  "status", "--porcelain", "--untracked-files=normal"
              ).decode()

              for args in (
                  ("diff", "--quiet", "--"),
                  ("diff", "--cached", "--quiet", "--"),
              ):
                  subprocess.check_call(["git", "-C", str(root), *args])

              raw = git("ls-files", "-z", "--", package_relative, workflow)
              paths = {
                  item.decode("utf-8")
                  for item in raw.split(bytes([0]))
                  if item
              }
              paths.add(workflow)
              paths = sorted(paths)
              report["source_hashes_before"] = fingerprint(paths)

              sys.path.insert(0, str(package))
              import retrieve

              manifest = retrieve.load_manifest()
              if not manifest:
                  raise RuntimeError("Corpus manifest has no entries")

              pinned = []
              for entry in manifest:
                  resolved = git(
                      "rev-parse", "--verify", entry["sha"] + "^{commit}"
                  ).decode().strip()
                  data = git("show", f"{resolved}:{entry['path']}")
                  pinned.append({
                      "doc": entry["doc"],
                      "path": entry["path"],
                      "manifest_sha": entry["sha"],
                      "resolved_commit": resolved,
                      "source_bytes_sha256": hashlib.sha256(data).hexdigest(),
                  })
              report["pinned_sources"] = pinned

              command = [
                  sys.executable, "-B", "-m", "pytest",
                  "-o", "addopts=",
                  "-p", "no:cacheprovider",
                  "-v", "--tb=short",
                  "--junitxml=" + str(out / "junit.xml"),
                  str(package / "tests"),
              ]
              report["pytest_command"] = command
              env = dict(os.environ)
              env["PYTHONPATH"] = str(package)
              env["PYTHONDONTWRITEBYTECODE"] = "1"
              env["PYTEST_DISABLE_PLUGIN_AUTOLOAD"] = "1"

              with (out / "pytest.log").open("w", encoding="utf-8") as log:
                  result = subprocess.run(
                      command,
                      cwd=out,
                      env=env,
                      stdout=log,
                      stderr=subprocess.STDOUT,
                      timeout=300,
                  )
              report["pytest_exit"] = result.returncode
              print((out / "pytest.log").read_text(encoding="utf-8"))

              report["source_hashes_after"] = fingerprint(paths)
              if report["source_hashes_after"] != report["source_hashes_before"]:
                  raise RuntimeError("Source hashes changed during execution")

              for args in (
                  ("diff", "--quiet", "--"),
                  ("diff", "--cached", "--quiet", "--"),
              ):
                  subprocess.check_call(["git", "-C", str(root), *args])

              report["git_status_after"] = git(
                  "status", "--porcelain", "--untracked-files=normal"
              ).decode()

              if result.returncode != 0:
                  raise RuntimeError(f"pytest failed with exit {result.returncode}")

              xml = ET.parse(out / "junit.xml").getroot()
              suites = list(xml.iter("testsuite"))
              counts = {
                  key: sum(int(suite.get(key, "0")) for suite in suites)
                  for key in ("tests", "failures", "errors", "skipped")
              }
              report["test_counts"] = counts

              if counts["tests"] == 0 or counts["failures"] or counts["errors"]:
                  raise RuntimeError("JUnit report has no tests or reports failures")

              report["status"] = "PASS"

          except Exception:
              error = traceback.format_exc()
              report["error"] = error
              (out / "error.log").write_text(error, encoding="utf-8")
              print(error, file=sys.stderr)

          finally:
              (out / "report.json").write_text(
                  json.dumps(report, indent=2) + chr(10),
                  encoding="utf-8",
              )
              entries = [
                  hashlib.sha256(path.read_bytes()).hexdigest() + "  " + path.name
                  for path in sorted(out.iterdir())
                  if path.is_file() and path.name != "SHA256SUMS"
              ]
              (out / "SHA256SUMS").write_text(
                  chr(10).join(entries) + chr(10),
                  encoding="utf-8",
              )

          print("RAG_EXECUTION_STATUS=" + report["status"])
          print("EXECUTION_CONTEXT=" + report["execution_context"])
          code = report["pytest_exit"]
          raise SystemExit(
              0 if report["status"] == "PASS"
              else code if isinstance(code, int) and code > 0
              else 1
          )
          PY

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqarion-rag-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: warn
          retention-days: 14
