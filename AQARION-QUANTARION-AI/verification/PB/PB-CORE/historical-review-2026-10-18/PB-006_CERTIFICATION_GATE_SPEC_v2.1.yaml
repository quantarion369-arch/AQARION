    all-ones column appended. Equals affine dimension + 1.
    NOT affine dimension itself.
  gap: >-
    m - affine_rank. Equals dimension of affine-dependency space.
  cyclic_points: >-
    Points on cycles of the functional digraph. |Cyc(f)| counts
