  partition_function: "p(k) = number of integer partitions of k, p(0) = 1"
  itinerary: >-
    For (S,T) with block partition beta: S -> {0,1} and L = |S|,
    itinerary of s is (beta(s), beta(Ts), ..., beta(T^{L-1}s)).
