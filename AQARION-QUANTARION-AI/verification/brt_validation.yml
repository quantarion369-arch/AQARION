name: AQARION BRT Kernel Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brt-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: BRT Exact Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile BRT Python files
        run: |
          python -m py_compile \
            verification/brt-validation.py \
            verification/brt-mutation.py

      - name: Run exact BRT validator
        run: |
          python verification/brt-validation.py \
            --cases verification/brt-cases.json \
            --report verification/brt-validation-report.json \
            2>&1 | tee verification/brt-validation.log

      - name: Run BRT semantic mutation suite
        run: |
          python verification/brt-mutation.py \
            2>&1 | tee verification/brt-mutation.log

      - name: Upload BRT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brt-validation-${{ github.sha }}
          path: |
            verification/brt-validation.log
            verification/brt-validation-report.json
            verification/brt-mutation.log
          if-no-files-found: error
          retention-days: 30
