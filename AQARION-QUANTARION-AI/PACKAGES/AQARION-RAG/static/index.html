<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AQARION-RAG Research Search</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf6f0;color:#2b2118;font:16px/1.6 system-ui,sans-serif}
main{max-width:900px;margin:auto;padding:24px 16px}
h1{margin-bottom:0}
.muted{color:#65594b}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
input{flex:1;min-width:180px}
input,select,button{font:inherit;padding:10px;border:1px solid #b7aa98;border-radius:8px}
button{cursor:pointer}
article{background:white;border:1px solid #d8cdbd;border-radius:10px;padding:16px;margin:12px 0}
.passage{white-space:pre-wrap;overflow-wrap:anywhere}
.metadata{font:13px/1.6 monospace;overflow-wrap:anywhere}
.warning{padding:12px;background:#fff0cc;border-left:4px solid #9b6200}
a{color:#075d7b}
.error{color:#a01818}
#status{min-height:1.6em}
.source-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#source-selector{flex:1;min-width:0;max-width:100%}
#source-view pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}
button:disabled{cursor:default;opacity:.55}
</style>
</head>
<body>
<main>
<h1>AQARION-RAG</h1>
<p class="muted">Inspect ranked passages and nearby qualifications, or search the claim registry.</p>
<form id="search" class="controls">
<label for="mode">Search</label>
<select id="mode">
<option value="passages">Passages + context</option>
<option value="claims">Claims</option>
</select>
<label for="q" hidden>Research question</label>
<input id="q" placeholder="Enter a research question..." autofocus>
<button type="submit">Search</button>
<p id="active-search-scope" class="warning" role="status" aria-live="polite" style="flex-basis:100%;margin:0">Search scope: All sources — source list loading.</p>
</form>
<div class="source-tools">
<label for="source-selector">Pinned source</label>
<select id="source-selector">
<option value="">All sources — global search</option>
</select>
<button id="open-source" type="button" disabled>Open complete source</button>
</div>
<p id="source-status" class="muted" role="status" aria-live="polite">
Loading source list…
</p>
<p id="status" role="status" aria-live="polite"></p>
<div id="out"></div>
<section id="source-view" hidden aria-label="Complete pinned source"></section>
<footer class="muted">Retrieval does not establish answerability or claim truth.</footer>
</main>
<script>
"use strict";

const out = document.getElementById("out");
const status = document.getElementById("status");
const input = document.getElementById("q");
const mode = document.getElementById("mode");
const sourceSelect = document.getElementById("source-selector");
const openSource = document.getElementById("open-source");
const sourceStatus = document.getElementById("source-status");
const sourceView = document.getElementById("source-view");
const sourceEntries = new Map();
const activeSearchScope = document.getElementById("active-search-scope");
let sourceListState = "loading";
let requestId = 0;
let controller = null;

function node(tag, text, className) {
  const element = document.createElement(tag);
  if (text !== undefined && text !== null) {
    element.textContent = String(text);
  }
  if (className) element.className = className;
  return element;
}

function sourceURL(item) {
  const sha = String(item.commit_sha || "");
  const path = String(item.path || "");
  if (!/^[0-9a-f]{40}$/i.test(sha)) return null;
  if (!path || path.startsWith("/")) return null;
  if (path.split("/").some(part => !part || part === "." || part === "..")) {
    return null;
  }
  return "https://github.com/quantarion369-arch/AQARION/blob/" +
    sha + "/" + path.split("/").map(encodeURIComponent).join("/");
}

function passage(item, supplementary, index) {
  const card = node("article");
  if (!supplementary) card.id = "seed-" + item.rank;

  card.append(node("h3", supplementary ?
    "Supplementary context " + (index + 1) : "Rank " + item.rank));

  if (supplementary) {
    card.append(node("p", "Context only - support not adjudicated.", "warning"));
  }

  card.append(node("div", "Source: " + item.path, "metadata"));
  card.append(node("div", "Pinned commit: " + item.commit_sha, "metadata"));
  card.append(node("div",
    "Character offsets [" + item.char_start + ", " + item.char_end +
    ") - decoded text, end exclusive", "metadata"));

  if (item.score !== undefined) {
    card.append(node("div", "Retrieval score: " + item.score, "metadata"));
  }

  const url = sourceURL(item);
  if (url) {
    const link = node("a", "Open source at pinned revision");
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    card.append(link);
  }

  card.append(node("p", item.passage, "passage"));

  for (const seed of item.seed_links || []) {
    const line = node("div", null, "metadata");
    const link = node("a", "Seed rank " + seed.seed_rank);
    link.href = "#seed-" + encodeURIComponent(String(seed.seed_rank));
    line.append(link, node("span",
      " | " + seed.direction + " neighbor | seed offsets [" +
      seed.seed_char_start + ", " + seed.seed_char_end + ")"));
    card.append(line);
  }
  return card;
}

function renderPassages(data) {
  out.append(node("h2", "Ranked passages"));
  out.append(node("p",
    "Original ranked results. Retrieved text is not independently verified support.",
    "muted"));

  const seeds = data.seed_results || [];
  if (!seeds.length) out.append(node("p", "No ranked passages found."));
  seeds.forEach((item, index) => out.append(passage(item, false, index)));

  out.append(node("h2", "Supplementary context"));
  out.append(node("p",
    "Immediate neighbors only. Context only - support not adjudicated.",
    "warning"));

  const extras = data.supplementary_context || [];
  if (!extras.length) out.append(node("p", "No supplementary context found."));
  extras.forEach((item, index) => out.append(passage(item, true, index)));
}

function renderClaims(data) {
  const claims = data.claims || [];
  out.append(node("h2", "Claim search"));
  if (!claims.length) out.append(node("p", "No claims found."));

  for (const claim of claims) {
    const card = node("article");
    card.append(node("h3", claim.section || "Claim"));
    if (claim.status) card.append(node("p", claim.status, "metadata"));
    for (const artifact of claim.artifacts || []) {
      card.append(node("div", "Artifact: " + artifact, "metadata"));
    }
    card.append(node("p", claim.text || "", "passage"));
    out.append(card);
  }
}

function relatedCitation(item, heading) {
  const card = node("article");
  card.append(node("h3", heading));
  card.append(node("div", "Source: " + item.path, "metadata"));
  card.append(node("div", "Pinned commit: " + item.commit_sha, "metadata"));
  card.append(node("div",
    "Character offsets [" + item.char_start + ", " + item.char_end +
    ") - decoded text, end exclusive", "metadata"));
  card.append(node("div",
    "Passage SHA-256: " + item.passage_sha256, "metadata"));

  const url = sourceURL(item);
  if (url) {
    const link = node("a", "Open source at pinned revision");
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    card.append(link);
  }
  card.append(node("p", item.passage, "passage"));
  return card;
}

function renderEvidence(data) {
  renderPassages(data.retrieval_context);
  out.append(node("h2", "Related corrections / qualifications"));
  out.append(node("p",
    "Explicit registry links, separate from ranking and immediate neighbors. " +
    "These may cite other sources; they are not selected-source retrieval. " +
    "Locator validation does not establish interpretation or claim truth.",
    "muted"));

  const items = data.related_evidence || [];
  if (!items.length) {
    out.append(node("p",
      "No validated registry links matched these returned passages. " +
      "This does not establish that no correction exists."));
  }

  for (const item of items) {
    const group = node("section");
    group.append(node("h3", item.id));
    const label = item.review_status === "approved" ?
      "Review recorded in registry - not independent verification by this interface." :
      "Documented correction - review pending. Candidate relationship.";
    group.append(node("p", label, "warning"));
    group.append(node("div",
      "Relation: " + item.relation +
      " | Locator validation: " + item.locator_validation, "metadata"));
    if (item.review_note) {
      group.append(node("p", item.review_note, "muted"));
    }
    group.append(relatedCitation(item.object, "Original statement - historical wording"));
    group.append(relatedCitation(item.subject, "Documented correction / qualification"));
    for (const evidence of item.supporting_evidence || []) {
      group.append(relatedCitation(
        evidence.citation, "Reported follow-up - not executed by this search"
      ));
      group.append(node("div", "Evidence role: " + evidence.role, "metadata"));
    }
    group.append(node("p", item.scope_note, "warning"));
    out.append(group);
  }

  const diagnostics = data.relationship_diagnostics || [];
  if (diagnostics.length) {
    out.append(node("h3", "Relationship validation warnings"));
    for (const diagnostic of diagnostics) {
      out.append(node("p",
        diagnostic.relationship_id + ": " + diagnostic.reason +
        ". This relationship was not displayed as valid.", "error"));
    }
  }
}

async function search() {
  syncSourceControls();
  hideSourceView();
  const selectedSource = mode.value === "passages" ? sourceSelect.value : "";
  const id = ++requestId;
  if (controller) controller.abort();
  controller = new AbortController();

  const selectedMode = mode.value;
  const query = input.value;
  out.replaceChildren();

  if (selectedMode === "passages" && !query.trim()) {
    status.textContent = "Enter a research question to search passages.";
    return;
  }

  status.textContent = "Searching...";
  const endpoint = selectedMode === "claims" ?
    "/api/claims/search" : "/api/search/evidence";

  const scopeParameter = selectedSource ?
    "&source_id=" + encodeURIComponent(selectedSource) : "";

  try {
    const response = await fetch(endpoint + "?q=" + encodeURIComponent(query) + scopeParameter,
      {signal: controller.signal});
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();

    if (id !== requestId) return;
    if (selectedMode === "passages" && selectedSource) {
      validateScopedEvidence(data, selectedSource);
    }
    out.replaceChildren();
    if (selectedSource) {
      out.append(node("p", "Retrieval restricted to: " +
        sourceEntries.get(selectedSource).doc, "warning"));
    }
    if (selectedMode === "claims") renderClaims(data);
    else renderEvidence(data);
    status.textContent = "Search complete.";
  } catch (error) {
    if (id !== requestId || error.name === "AbortError") return;
    status.textContent = "Search failed: " + error.message;
    out.replaceChildren(node("p", "No results displayed. Retry the search.", "error"));
  }
}

document.getElementById("search").addEventListener("submit", event => {
  event.preventDefault();
  search();
});

function handleModeChange() {
  ++requestId;
  if (controller) controller.abort();
  hideSourceView();
  out.replaceChildren();
  syncSourceControls();
  status.textContent = "Mode changed. Press Search or Enter.";
}

mode.addEventListener("change", handleModeChange);

input.addEventListener("input", () => {
  hideSourceView();
  ++requestId;
  if (controller) controller.abort();
  out.replaceChildren();
  status.textContent = "Query changed. Press Search or Enter.";
});


function hideSourceView() {
  sourceView.hidden = true;
  sourceView.replaceChildren();
}

function updateSearchScope() {
  if (mode.value === "claims") {
    activeSearchScope.textContent =
      "Search scope: claim registry — pinned-source selection does not apply.";
    return;
  }
  const selected = sourceSelect.value;
  if (selected) {
    const entry = sourceEntries.get(selected);
    activeSearchScope.textContent = entry
      ? "Search scope: " + entry.doc + " — one pinned document."
      : "Search scope: selected source unavailable — choose a valid pinned source.";
    return;
  }
  if (sourceListState === "loaded") {
    const count = sourceEntries.size;
    activeSearchScope.textContent =
      "Search scope: All sources — " + count +
      (count === 1 ? " pinned document." : " pinned documents.");
  } else {
    activeSearchScope.textContent = sourceListState === "failed"
      ? "Search scope: All sources — source count unavailable."
      : "Search scope: All sources — source list loading.";
  }
}

function syncSourceControls() {
  const claimsMode = mode.value === "claims";
  sourceSelect.disabled = claimsMode;
  openSource.disabled = claimsMode || !sourceSelect.value;
  updateSearchScope();
}

function validateScopedEvidence(data, selectedSource) {
  const selected = sourceEntries.get(selectedSource);
  const bundle = data.retrieval_context;

  if (!selected || !bundle ||
      !Array.isArray(bundle.seed_results) ||
      !Array.isArray(bundle.supplementary_context)) {
    throw new Error("Invalid scoped evidence response");
  }

  for (const item of [
    ...bundle.seed_results, ...bundle.supplementary_context
  ]) {
    if (item.path !== selected.path ||
        item.commit_sha !== selected.sha ||
        item.doc !== selected.doc) {
      throw new Error("Response crossed the selected source boundary");
    }
  }
}

async function loadSources() {
  try {
    const response = await fetch("/api/sources");
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();

    if (!Array.isArray(data.sources)) {
      throw new Error("Invalid source list");
    }

    const entries = new Map();
    const options = [node("option", "All sources — global search")];
    options[0].value = "";

    for (const item of data.sources) {
      if (!item || typeof item.source_id !== "string" ||
          !item.source_id || typeof item.doc !== "string" ||
          typeof item.path !== "string" ||
          !/^[0-9a-f]{40}$/i.test(String(item.sha || "")) ||
          item.source_id !== item.path + "@" + item.sha ||
          entries.has(item.source_id)) {
        throw new Error("Invalid or duplicate source identity");
      }
      entries.set(item.source_id, item);
      const option = node(
        "option", item.doc + " · " + item.sha.slice(0, 12)
      );
      option.value = item.source_id;
      options.push(option);
    }

    const previous = sourceSelect.value;
    sourceEntries.clear();
    for (const [key, value] of entries) sourceEntries.set(key, value);
    sourceSelect.replaceChildren(...options);
    if (entries.has(previous)) sourceSelect.value = previous;
    sourceListState = "loaded";
    syncSourceControls();

    sourceStatus.textContent =
      entries.size + " pinned sources available. " +
      "Source selection constrains passages, not claim-registry search.";
  } catch (error) {
    sourceListState = "failed";
    updateSearchScope();
    sourceStatus.textContent =
      "Source list unavailable: " + error.message +
      ". Global search remains available.";
  }
}

async function openCompleteSource() {
  const selectedSource = sourceSelect.value;
  if (mode.value === "claims" || !selectedSource) return;

  const id = ++requestId;
  if (controller) controller.abort();
  controller = new AbortController();

  hideSourceView();
  out.replaceChildren();
  status.textContent = "Opening complete pinned source...";

  try {
    const response = await fetch(
      "/api/sources/view?source_id=" + encodeURIComponent(selectedSource),
      {signal: controller.signal}
    );
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();

    if (id !== requestId) return;

    const expected = sourceEntries.get(selectedSource);
    const source = data.source;
    if (!expected || !source ||
        source.source_id !== selectedSource ||
        source.path !== expected.path ||
        source.sha !== expected.sha ||
        source.doc !== expected.doc ||
        typeof data.text !== "string") {
      throw new Error("Source view identity mismatch");
    }

    sourceView.append(node("h2", source.doc));
    sourceView.append(node(
      "p",
      "Complete pinned source. This is source navigation, not ranked evidence " +
      "or independent verification.",
      "warning"
    ));
    sourceView.append(node("div", "Source: " + source.path, "metadata"));
    sourceView.append(node("div", "Pinned commit: " + source.sha, "metadata"));

    const url = sourceURL({
      path: source.path,
      commit_sha: source.sha
    });
    if (url) {
      const link = node("a", "Open source at pinned revision");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      sourceView.append(link);
    }

    sourceView.append(node("pre", data.text, "passage"));
    sourceView.hidden = false;
    status.textContent = "Complete pinned source loaded.";
  } catch (error) {
    if (id !== requestId || error.name === "AbortError") return;
    hideSourceView();
    status.textContent = "Source view failed: " + error.message;
  }
}

sourceSelect.addEventListener("change", () => {
  ++requestId;
  if (controller) controller.abort();
  hideSourceView();
  out.replaceChildren();
  syncSourceControls();
  status.textContent =
    "Source changed. Press Search or Open complete source.";
});

openSource.addEventListener("click", openCompleteSource);

loadSources();
search();

</script>
</body>
</html>
