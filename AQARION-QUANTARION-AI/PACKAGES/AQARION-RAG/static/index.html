<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AQARION-RAG Research Search</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf6f0;color:#2b2118;font:16px/1.6 system-ui,sans-serif}
main{max-width:900px;margin:auto;padding:24px 16px}
h1{margin-bottom:0}
.muted{color:#65594b}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
input{flex:1;min-width:180px}
input,select,button{font:inherit;padding:10px;border:1px solid #b7aa98;border-radius:8px}
button{cursor:pointer}
article{background:white;border:1px solid #d8cdbd;border-radius:10px;padding:16px;margin:12px 0}
.passage{white-space:pre-wrap;overflow-wrap:anywhere}
.metadata{font:13px/1.6 monospace;overflow-wrap:anywhere}
.warning{padding:12px;background:#fff0cc;border-left:4px solid #9b6200}
a{color:#075d7b}
.error{color:#a01818}
#status{min-height:1.6em}
</style>
</head>
<body>
<main>
<h1>AQARION-RAG</h1>
<p class="muted">Inspect ranked passages and nearby qualifications, or search the claim registry.</p>
<form id="search" class="controls">
<label for="mode">Search</label>
<select id="mode">
<option value="passages">Passages + context</option>
<option value="claims">Claims</option>
</select>
<label for="q" hidden>Research question</label>
<input id="q" placeholder="Enter a research question..." autofocus>
<button type="submit">Search</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<div id="out"></div>
<footer class="muted">Retrieval does not establish answerability or claim truth.</footer>
</main>
<script>
"use strict";

const out = document.getElementById("out");
const status = document.getElementById("status");
const input = document.getElementById("q");
const mode = document.getElementById("mode");
let requestId = 0;
let controller = null;

function node(tag, text, className) {
  const element = document.createElement(tag);
  if (text !== undefined && text !== null) {
    element.textContent = String(text);
  }
  if (className) element.className = className;
  return element;
}

function sourceURL(item) {
  const sha = String(item.commit_sha || "");
  const path = String(item.path || "");
  if (!/^[0-9a-f]{40}$/i.test(sha)) return null;
  if (!path || path.startsWith("/")) return null;
  if (path.split("/").some(part => !part || part === "." || part === "..")) {
    return null;
  }
  return "https://github.com/quantarion369-arch/AQARION/blob/" +
    sha + "/" + path.split("/").map(encodeURIComponent).join("/");
}

function passage(item, supplementary, index) {
  const card = node("article");
  if (!supplementary) card.id = "seed-" + item.rank;

  card.append(node("h3", supplementary ?
    "Supplementary context " + (index + 1) : "Rank " + item.rank));

  if (supplementary) {
    card.append(node("p", "Context only - support not adjudicated.", "warning"));
  }

  card.append(node("div", "Source: " + item.path, "metadata"));
  card.append(node("div", "Pinned commit: " + item.commit_sha, "metadata"));
  card.append(node("div",
    "Character offsets [" + item.char_start + ", " + item.char_end +
    ") - decoded text, end exclusive", "metadata"));

  if (item.score !== undefined) {
    card.append(node("div", "Retrieval score: " + item.score, "metadata"));
  }

  const url = sourceURL(item);
  if (url) {
    const link = node("a", "Open source at pinned revision");
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    card.append(link);
  }

  card.append(node("p", item.passage, "passage"));

  for (const seed of item.seed_links || []) {
    const line = node("div", null, "metadata");
    const link = node("a", "Seed rank " + seed.seed_rank);
    link.href = "#seed-" + encodeURIComponent(String(seed.seed_rank));
    line.append(link, node("span",
      " | " + seed.direction + " neighbor | seed offsets [" +
      seed.seed_char_start + ", " + seed.seed_char_end + ")"));
    card.append(line);
  }
  return card;
}

function renderPassages(data) {
  out.append(node("h2", "Ranked passages"));
  out.append(node("p",
    "Original ranked results. Retrieved text is not independently verified support.",
    "muted"));

  const seeds = data.seed_results || [];
  if (!seeds.length) out.append(node("p", "No ranked passages found."));
  seeds.forEach((item, index) => out.append(passage(item, false, index)));

  out.append(node("h2", "Supplementary context"));
  out.append(node("p",
    "Immediate neighbors only. Context only - support not adjudicated.",
    "warning"));

  const extras = data.supplementary_context || [];
  if (!extras.length) out.append(node("p", "No supplementary context found."));
  extras.forEach((item, index) => out.append(passage(item, true, index)));
}

function renderClaims(data) {
  const claims = data.claims || [];
  out.append(node("h2", "Claim search"));
  if (!claims.length) out.append(node("p", "No claims found."));

  for (const claim of claims) {
    const card = node("article");
    card.append(node("h3", claim.section || "Claim"));
    if (claim.status) card.append(node("p", claim.status, "metadata"));
    for (const artifact of claim.artifacts || []) {
      card.append(node("div", "Artifact: " + artifact, "metadata"));
    }
    card.append(node("p", claim.text || "", "passage"));
    out.append(card);
  }
}

async function search() {
  const id = ++requestId;
  if (controller) controller.abort();
  controller = new AbortController();

  const selectedMode = mode.value;
  const query = input.value;
  out.replaceChildren();

  if (selectedMode === "passages" && !query.trim()) {
    status.textContent = "Enter a research question to search passages.";
    return;
  }

  status.textContent = "Searching...";
  const endpoint = selectedMode === "claims" ?
    "/api/claims/search" : "/api/search/context";

  try {
    const response = await fetch(endpoint + "?q=" + encodeURIComponent(query),
      {signal: controller.signal});
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();

    if (id !== requestId) return;
    out.replaceChildren();
    if (selectedMode === "claims") renderClaims(data);
    else renderPassages(data);
    status.textContent = "Search complete.";
  } catch (error) {
    if (id !== requestId || error.name === "AbortError") return;
    status.textContent = "Search failed: " + error.message;
    out.replaceChildren(node("p", "No results displayed. Retry the search.", "error"));
  }
}

document.getElementById("search").addEventListener("submit", event => {
  event.preventDefault();
  search();
});

mode.addEventListener("change", search);

input.addEventListener("input", () => {
  ++requestId;
  if (controller) controller.abort();
  out.replaceChildren();
  status.textContent = "Query changed. Press Search or Enter.";
});

search();
</script>
</body>
</html>
