<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AQARION-RAG — Claim Search</title>
<style>
:root{--bg:#faf6f0;--panel:#fff;--border:#e2d9cb;--text:#2b2118;--muted:#8a7a66;--accent:#b45309;--accent2:#0e7490;--ok:#15803d;--mono:'SF Mono',Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
.wrap{width:100%;max-width:680px}
h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:24px}
.search-box{position:relative;margin-bottom:24px}
input{width:100%;padding:14px 16px 14px 44px;border:1px solid var(--border);border-radius:12px;font-size:1rem;background:var(--panel);color:var(--text);outline:none;transition:border-color .2s}
input:focus{border-color:var(--accent2)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1.1rem}
.claim{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;transition:box-shadow .2s}
.claim:hover{box-shadow:0 4px 12px rgba(0,0,0,.06)}
.claim-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.section{font-weight:700;font-size:.95rem}
.status{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:600;font-family:var(--mono);background:rgba(21,128,61,.1);color:var(--ok);border:1px solid rgba(21,128,61,.25)}
.artifact{color:var(--accent);font-size:.75rem;font-family:var(--mono);margin-bottom:6px}
.text{color:var(--muted);font-size:.85rem;line-height:1.55}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:.9rem}
footer{margin-top:auto;padding-top:32px;color:var(--muted);font-size:.75rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<h1>AQARION<span>-RAG</span></h1>
<div class="sub">Search the claim registry — evidence-aware retrieval</div>
<div class="search-box">
<span class="search-icon">⌕</span>
<input id="q" placeholder="Search claims, theorems, artifacts..." autofocus>
</div>
<div id="out"><div class="empty">Loading claims…</div></div>
</div>
<footer>AQARION-RAG · Separate from the mathematics verification dashboard</footer>
<script>
async function load(q){
const url="/api/claims/search?q="+encodeURIComponent(q);
const r=await fetch(url);const d=await r.json();
const out=document.getElementById("out");
out.innerHTML="";
if(!d.claims||!d.claims.length){out.innerHTML='<div class="empty">No claims found'+(q?' for "'+q+'"':'')+'.</div>';return}
for(const c of d.claims){
const div=document.createElement("div");div.className="claim";
const art=c.artifacts.length?'<div class="artifact">artifact: '+c.artifacts[0].slice(0,16)+'…</div>':"";
div.innerHTML='<div class="claim-header"><span class="section">'+c.section+'</span>'+(c.status?'<span class="status">'+c.status+'</span>':"")+'</div>'+art+'<div class="text">'+c.text.slice(0,200)+'…</div>';
out.appendChild(div)}}
document.getElementById("q").addEventListener("input",e=>load(e.target.value));
load("");
</script>
</body>
</html>
